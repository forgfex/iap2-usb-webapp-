[project]
name = "iap2-usb-webapp"
version = "0.1.0"
description = "USB iAP2 accessory-location + Web map picker (fusion of accessory-location and iap2loc)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "pymobiledevice3>=9.40,<10",
]

[project.scripts]
iap2-usb-webapp = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
